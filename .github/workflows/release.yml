name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # cosign keyless signing (OIDC)
  packages: write # push the container image to ghcr.io

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0 # goreleaser's sboms block uses syft
      - uses: docker/setup-qemu-action@v3 # emulation for the linux/arm64 image build
      - uses: docker/setup-buildx-action@v4 # goreleaser's docker build uses buildx
      # Log in so goreleaser can push the ghcr.io image; without this the docker
      # step fails and takes the whole release (tarballs included) down with it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Push access to the separate pgrundev/homebrew-tap repo. Empty until the
          # secret is added — the brews block skips the push in that case, so the
          # release still succeeds. Set it to publish the Homebrew formula.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
