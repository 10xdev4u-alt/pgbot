version: 2

project_name: pgbot

before:
  hooks:
    - go mod tidy

builds:
  - id: pgbot
    main: ./cmd/pgbot
    binary: pgbot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: pgbot
    formats: [tar.gz]
    # Windows users expect a zip, not a tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "pgbot_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

# Per-artifact CycloneDX SBOMs, published alongside the binaries — a supply-chain
# expectation for a tool that connects to production databases.
sboms:
  - id: pgbot
    artifacts: archive

# SHA256 checksums — the install script verifies against this before chmod +x.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless signing of the checksum file with cosign. A curl|sh installer that
# fetches an unverified binary is a supply-chain hazard; publishing a signed
# checksum lets the paranoid verify provenance.
signs:
  # A self-contained cosign bundle (cert + signature + rekor entry in one file).
  # The installer verifies it with `cosign verify-blob --bundle`, so it no longer
  # depends on the --certificate/--signature flags cosign v3 has deprecated. This
  # is the preferred path.
  - id: cosign-bundle
    cmd: cosign
    signature: "${artifact}.cosign.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true
  # Detached certificate + signature, kept for one transition release so an older
  # cosign (or a bundle fetch that fails) still verifies via the installer's
  # fallback. Can be dropped once the bundle has shipped.
  - id: cosign-detached
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

nfpms:
  - id: pgbot
    package_name: pgbot
    vendor: pgrun.dev
    homepage: https://pgbot.dev
    maintainer: pgrun <hello@pgrun.dev>
    description: In-database observability for PostgreSQL.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin

dockers:
  - image_templates:
      - "ghcr.io/pgrundev/pgbot:{{ .Version }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64
  - image_templates:
      - "ghcr.io/pgrundev/pgbot:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64

# Publish multi-arch manifests so `docker run ghcr.io/pgrundev/pgbot` (i.e.
# :latest) works on Apple Silicon / Graviton, not just amd64. The README lists
# Docker as a first-class install method and uses the bare (:latest) tag.
docker_manifests:
  - name_template: "ghcr.io/pgrundev/pgbot:{{ .Version }}"
    image_templates:
      - "ghcr.io/pgrundev/pgbot:{{ .Version }}-amd64"
      - "ghcr.io/pgrundev/pgbot:{{ .Version }}-arm64"
  - name_template: "ghcr.io/pgrundev/pgbot:latest"
    image_templates:
      - "ghcr.io/pgrundev/pgbot:{{ .Version }}-amd64"
      - "ghcr.io/pgrundev/pgbot:{{ .Version }}-arm64"

# Homebrew formula, pushed to the pgrundev/homebrew-tap repo so
# `brew install pgrundev/tap/pgbot` works (issue #8). The push authenticates with
# a DEPLOY KEY scoped to the tap repo (git mode), not a personal access token:
# the release workflow's GITHUB_TOKEN can't write to another repo, and a deploy
# key can write to exactly one. $HOMEBREW_TAP_DEPLOY_KEY holds the private key
# contents (release.yml passes the secret). skip_upload is templated on it: when
# the secret is unset the formula is still generated (dist/homebrew) but NOT
# pushed, so a release never fails for a missing tap credential — and the
# release's brew-smoke job then fails loudly instead of the install silently
# 404ing for users.
brews:
  - name: pgbot
    repository:
      owner: pgrundev
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:pgrundev/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_DEPLOY_KEY }}false{{ else }}true{{ end }}'
    commit_author:
      name: pgbot-release
      email: hello@pgrun.dev
    commit_msg_template: "pgbot {{ .Tag }}"
    directory: Formula
    homepage: "https://pgbot.dev"
    # No trailing full stop and bin/"pgbot" in the test: `brew audit` style.
    description: "In-database observability for PostgreSQL"
    license: "Apache-2.0"
    install: |
      bin.install "pgbot"
    test: |
      system bin/"pgbot", "--version"

release:
  github:
    owner: pgrundev
    name: pgbot
  prerelease: auto
  # Publish the JSON Schema for the --json contracts as release assets, so a
  # consumer can pin against a version (B7-2). The files are generated from the
  # Go types and drift-checked in CI (TestSchema_matchesModel).
  extra_files:
    - glob: ./schema/*.json

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
